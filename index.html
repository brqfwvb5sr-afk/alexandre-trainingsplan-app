<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0d12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Trainingsplan">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Minimalistische Trainingsplan-App fuer Ale.">
    <title>Trainingsplan</title>
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="manifest" href="./manifest.json?v=12">
    <link rel="stylesheet" href="./style.css?v=12">
  </head>
  <body>
    <main class="app-shell" id="app">
      <header class="app-header">
        <div>
          <p class="overline">Trainingsplan</p>
          <h1>Ale</h1>
        </div>
        <p class="version-pill" id="versionLabel">Version 12</p>
      </header>

      <section class="tab-panel is-active" id="tab-today" data-panel="today" aria-labelledby="nav-today">
        <div id="todayContent"></div>
      </section>

      <section class="tab-panel" id="tab-week" data-panel="week" aria-labelledby="nav-week">
        <div id="weekContent"></div>
      </section>

      <section class="tab-panel" id="tab-strength" data-panel="strength" aria-labelledby="nav-strength">
        <div id="strengthContent"></div>
      </section>

      <nav class="bottom-nav" aria-label="Hauptnavigation">
        <button class="nav-button is-active" id="nav-today" type="button" data-tab="today">
          <span class="nav-dot" aria-hidden="true"></span>
          <span>Heute</span>
        </button>
        <button class="nav-button" id="nav-week" type="button" data-tab="week">
          <span class="nav-dot" aria-hidden="true"></span>
          <span>Woche</span>
        </button>
        <button class="nav-button" id="nav-strength" type="button" data-tab="strength">
          <span class="nav-dot" aria-hidden="true"></span>
          <span>Kraftplan</span>
        </button>
      </nav>
    </main>

    <script src="./app.js?v=12" defer></script>
  </body>
</html>
